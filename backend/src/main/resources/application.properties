spring.application.name=planazo

# Database Configuration (Defaults to local PostgreSQL, overridden by Docker env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/planazo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# JWT Configuration
# IMPORTANT: Override this in production!
jwt.access.secret=${JWT_ACCESS_SECRET:}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:}
jwt.refresh.bytes=${JWT_REFRESH_BYTES:}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:}

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false

app.mail.from=${SMTP_USERNAME:}

# Web Auth URL for email links
app.web-auth-url=${WEB_AUTH_URL:}

# Admin account bootstrap
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:}
app.admin.lastname=${ADMIN_LASTNAME:}
app.admin.gender=${ADMIN_GENDER:}
app.admin.photo=${ADMIN_PHOTO:}
app.admin.birth-date=${ADMIN_BIRTH_DATE:}

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:}