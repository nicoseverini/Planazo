<!DOCTYPE html>
<html>
<head>
    <style>
        .button {
            background-color: #007bff;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 8px;
        }
    </style>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; border: 1px solid #ddd; padding: 20px;">
        <h2 style="color: #dc3545;">Your tourist place has been deleted</h2>
        <p>Hello,</p>
        <p>We regret to inform you that your tourist place "<strong>${placeName}</strong>" has been deleted by an administrator.</p>
        <p><strong>Reason for deletion:</strong> ${reason}</p>
        <p>If you believe this was done in error, please contact our support team.</p>
        <p style="font-size: 12px; color: #888;">This is an automated message from Planazo.</p>
    </div>
</body>
</html>
