<!DOCTYPE html>
<html>
<head>
    <style>
        .button {
            background-color: #007bff;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 8px;
        }
    </style>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; border: 1px solid #ddd; padding: 20px;">
        <h2 style="color: #007bff;">Welcome to Planazo!</h2>
        <p>Hello,</p>
        <p>Thank you for joining. To activate your account and start organizing your outings, please verify your email address.</p>
        <div style="text-align: center; margin: 30px 0;">
            <a href="${verificationUrl}" class="button" style="color: white;">Verify my account</a>
        </div>
        <p style="font-size: 12px; color: #888;">If you didn't create an account in Planazo, you can ignore this email.</p>
    </div>
</body>
</html>
